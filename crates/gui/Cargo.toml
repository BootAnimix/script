[package]
name = "bootanimix-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Studio session state and editing operations shared by the BootAnimix 3.0 desktop GUI"

[lib]
name = "bootanimix_gui_lib"
path = "src/lib.rs"

[dependencies]
bootanimix-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
