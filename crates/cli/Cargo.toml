[package]
name = "bootanimix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for BootAnimix"

[[bin]]
name = "bootanimix"
path = "src/main.rs"

[dependencies]
bootanimix-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
