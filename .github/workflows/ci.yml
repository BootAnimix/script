name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Core, CLI, TUI & GUI Backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run unit, integration, and property tests
        run: cargo test --workspace

  frontend:
    name: Svelte + TypeScript GUI Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run svelte-check (TypeScript & Svelte types)
        run: npm run check
      - name: Build production GUI bundle
        run: npm run build
