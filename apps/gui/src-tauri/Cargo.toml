[package]
name = "bootanimix-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri 2 desktop backend for BootAnimix 3.0 Studio"

[lib]
name = "bootanimix_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "bootanimix-gui"
path = "src/main.rs"

[dependencies]
bootanimix-core = { path = "../../../crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
