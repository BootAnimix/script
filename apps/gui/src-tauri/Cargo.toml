[package]
name = "bootanimix-studio"
version = "3.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BootAnimix/script"
description = "BootAnimix 3.0 Studio — Tauri 2 desktop shell for the visual boot animation editor"

# This crate is deliberately its own workspace root. The Tauri runtime pulls in
# platform webview toolchains (webkit2gtk on Linux) that the CLI/TUI crates
# must not depend on, and keeping the two workspaces separate means
# `cargo test --workspace` in the repo root never needs a browser engine.
[workspace]

[lib]
name = "bootanimix_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "bootanimix-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bootanimix-core = { path = "../../../crates/core" }
bootanimix-gui = { path = "../../../crates/gui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
